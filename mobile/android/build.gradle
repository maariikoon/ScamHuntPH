// Top-level build file where you can add configuration options common to all sub-projects/modules.
//android/build.gradle
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}


apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// 🛠️ Force-disable all KSP tasks globally for Expo EAS (Debug + Release)
gradle.projectsEvaluated {
    tasks.matching { it.name.toLowerCase().contains("ksp") }.all { task ->
        if (task.path.startsWith(":expo-updates:")) {
            task.enabled = false
            println("⚙️ Disabled KSP task globally: ${task.path}")
        }
    }
}
